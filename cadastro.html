<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastro - BookClub</title>
</head>
<body>
    <main>
        <section class="sessao-imagem">
            <img src="img/tela-login.png" alt="Casal numa livraria">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h3>Book<span>Club</span></h3>
                <h2>Troque livros, multiplique histórias</h2>
            </div>
            
            <form action="#" method="post" id="form-login">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Informe seu nome">
                
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Informe seu email">
                
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Informe seu usuário">
                <div class="cadastro-senha">
                    <div>
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Informe uma senha">
                    </div>
                    </div>  
                        <label for="confirme-senha">Confirme senha</label>
                        <input type="password" id="confirme-senha" placeholder="Confirme a senha">
                    </div>
                </div>
                
                <button type="submit" id="btn-acessar">Cadastre-se</button>
                
                <a href="cadastro.html" id="nao-conta">Já possuo conta. Acesse agora!</a>
            </form>
        </section>
    </main>
</body>
</html>
